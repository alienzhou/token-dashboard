<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token 日志 · AI Passport</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#243c36;background:#f4f7f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:1140px;margin:auto;padding:42px 36px}header{display:flex;align-items:center;justify-content:space-between;font-size:13px}.brand{font-weight:700;letter-spacing:2px}.mark{color:#178b77;margin-right:10px}.link{border:1px solid #dce7e1;border-radius:99px;padding:10px 16px;color:#657a70;background:#fff;font-size:12px;max-width:390px}.link:before{content:"";display:inline-block;width:7px;height:7px;background:#aebcb6;border-radius:50%;margin-right:9px}.link.connected:before{background:#178b77}.intro{margin:56px 0 30px;display:flex;align-items:flex-end;justify-content:space-between}.eyebrow{font-size:12px;letter-spacing:2px;color:#178b77;font-weight:600}.intro h1{font-size:38px;letter-spacing:-1px;margin:13px 0}.intro p{font-size:14px;color:#83938a;margin:0}.today{text-align:right;color:#83938a;font-size:13px}.today strong{display:block;font-size:32px;line-height:1.4;color:#173f35;font-variant-numeric:tabular-nums}.stats{background:#fff;border:1px solid #e2e9e5;border-radius:18px;display:grid;grid-template-columns:repeat(5,1fr);padding:24px 0;margin-bottom:26px}.stat{padding:0 24px;border-right:1px solid #e9eeeb}.stat:last-child{border:0}.stat b{display:block;font-size:24px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;display:block;color:#83938a;margin-top:9px}.card{background:#fff;border:1px solid #e2e9e5;border-radius:18px;padding:26px 28px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h2{margin:0;font-size:16px;font-weight:600}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{border:0;background:none;color:#83938a;border-radius:8px;font-size:12px;padding:7px 10px}.tabs button.active{background:#e7f3ee;color:#16775f;font-weight:600}.heatwrap{overflow-x:auto;padding:2px 0}.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:minmax(10px,1fr);gap:4px;min-width:720px}.cell{border-radius:3px;position:relative}.cell:hover{outline:2px solid #173f35;outline-offset:1px}.months{display:flex;justify-content:space-between;margin-top:13px;color:#8b9a92;font-size:11px;min-width:720px}.heatfoot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:12px;color:#8b9a92}.legend{display:flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:3px}.tools-title{display:flex;justify-content:space-between;align-items:center;margin:34px 0 16px}.tools-title span{color:#8b9a92;font-size:12px}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.tool{background:#fff;border:1px solid #e2e9e5;border-radius:14px;padding:19px 16px}.tool-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.tool strong{display:block;font-size:25px;margin-top:23px;font-weight:500;letter-spacing:-1px}.tool .state{font-size:11px;color:#83938a;margin-top:7px}.track{height:3px;background:#edf1ef;border-radius:2px;margin-top:17px;overflow:hidden}.track i{display:block;height:100%}.footer{display:flex;justify-content:space-between;gap:20px;color:#95a399;font-size:11px;margin-top:28px;line-height:1.8}.hint{margin-top:14px;font-size:12px;color:#83938a;line-height:1.8}.empty{color:#95a399}a{color:#178b77;text-decoration:none}@media(max-width:850px){main{padding:26px 20px}.intro{margin-top:40px}.intro h1{font-size:30px}.stats{grid-template-columns:repeat(3,1fr);gap:20px}.stat{padding:0 14px}.stat b{font-size:21px}.tools{grid-template-columns:repeat(3,1fr)}.cardhead{align-items:flex-start;gap:15px;flex-direction:column}.link{max-width:220px}.footer{flex-direction:column}}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:repeat(2,1fr)}.today{display:none}.brand{font-size:11px}.link{max-width:180px}.card{padding:22px 18px}}
</style>
<main><header><div class="brand"><span class="mark">▣</span>TOKEN / PASSPORT</div><div class="link" id="connection">正在读取本地用量</div></header>
<div class="intro"><div><div class="eyebrow">YOUR AI FOOTPRINT</div><h1>你的 AI 用量足迹</h1><p>本地自动采集，随身查看每一次积累。</p></div><div class="today">今日 Token<strong id="today">—</strong><span id="date"></span></div></div>
<div class="stats"><div class="stat"><b id="total">—</b><span>累计 Token 数</span></div><div class="stat"><b id="peak">—</b><span>单日使用峰值</span></div><div class="stat"><b id="task">—</b><span>最长任务用时 · Codex</span></div><div class="stat"><b id="longest">—</b><span>最长连续天数</span></div><div class="stat"><b id="current">—</b><span>当前连续天数</span></div></div>
<section class="card"><div class="cardhead"><h2>Token 活动</h2><div class="tabs" id="tabs"></div></div><div class="heatwrap"><div class="heat" id="heat"></div><div class="months" id="months"></div></div><div class="heatfoot"><span id="activity">最近 52 周 · 北京时间</span><div class="legend">少 <i style="background:#e2e9e7"></i><i style="background:#c0e9dc"></i><i style="background:#7acdb5"></i><i style="background:#38ab8a"></i><i style="background:#16775f"></i> 多</div></div></section>
<div class="tools-title"><h2>用量来源</h2><span>每 5 秒增量采集</span></div><div class="tools" id="tools"></div><div class="hint">首次蓝牙连接：长按设备确认键，在电脑输入设备屏幕上的配对码。配对后自动重连。</div>
<div class="footer"><span>只读取本地用量元数据 · 仅向 AI Passport 同步汇总统计<br>累计值来自可读取的历史记录，不代表订阅额度或账单。</span><span id="updated">等待首次采集</span></div></main>
<script>
const $=id=>document.getElementById(id),colors=['#178b77','#c58552','#8995ac','#7376cd','#428bc4'],heatColors=['#e2e9e7','#c0e9dc','#7acdb5','#38ab8a','#16775f'];let filter=-1,data=null;
const number=n=>n>=1e8?(n/1e8).toFixed(1)+'亿':n>=1e4?(n/1e4).toFixed(1)+'万':n.toLocaleString('zh-CN');
const status=['未发现记录','本地自动采集','暂不支持','记录不完整，请检查采集'];
const fmtDate=epoch=>new Date(epoch*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
function render(){if(!data||!data.snapshot)return;const s=data.snapshot,f=filter<0?s:s.sources[filter];const missing=filter>=0&&f.status!==1&&!f.total;$('total').textContent=missing?'—':number(f.total);$('total').title=f.total.toLocaleString('zh-CN');$('today').textContent=missing?'—':number(f.today);$('peak').textContent=missing?'—':number(f.peak);$('task').textContent=(filter<1&&s.longest_task)?Math.floor(s.longest_task/3600)+'时 '+Math.floor(s.longest_task%3600/60)+'分':'—';$('longest').textContent=missing?'—':f.longest+' 天';$('current').textContent=missing?'—':f.current+' 天';$('date').textContent=fmtDate(s.updated).split(' ')[0];const conn=data.connection;$('connection').textContent=conn.message;$('connection').className='link '+conn.state;$('updated').textContent='本地更新 '+fmtDate(s.updated)+(conn.last_sync?' · 蓝牙同步 '+fmtDate(conn.last_sync):'');$('tabs').replaceChildren();['全部',...s.sources.map(x=>x.name)].forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.className=filter===i-1?'active':'';b.onclick=()=>{filter=i-1;render()};$('tabs').append(b)});
const days=f.days,peak=Math.max(...days),first=s.end_day-days.length+1,shift=(first+3)%7;$('heat').replaceChildren();for(let i=0;i<Math.ceil((shift+days.length)/7)*7;i++){const j=i-shift,valid=j>=0&&j<days.length,n=valid?days[j]:0,l=!n?0:n<=peak/8?1:n<=peak/3?2:n<=peak*2/3?3:4,c=document.createElement('div');c.className='cell';c.style.background=heatColors[l];if(!valid)c.style.opacity='.25';else c.title=new Date((first+j)*86400000).toISOString().slice(0,10)+' · '+n.toLocaleString('zh-CN')+' Token';$('heat').append(c)}$('months').replaceChildren();let prev='';for(let i=0;i<days.length;i+=7){const month=new Date((first+i)*86400000).getUTCMonth()+1;if(month!==prev){const span=document.createElement('span');span.textContent=month+'月';$('months').append(span);prev=month}}const lastMonth=new Date(s.end_day*86400000).getUTCMonth()+1;if(lastMonth!==prev){const span=document.createElement('span');span.textContent=lastMonth+'月';$('months').append(span)}$('activity').textContent=missing?status[f.status]+' · 无可统计的 Token 明细':'最近 52 周 · '+days.filter(n=>n>0).length+' 个活跃日 · 北京时间';$('tools').replaceChildren();s.sources.forEach((t,i)=>{const o=document.createElement('div');o.className='tool';const name=document.createElement('div');name.className='tool-name';const dot=document.createElement('i');dot.className='dot';dot.style.background=colors[i];name.append(dot,document.createTextNode(t.name));const n=document.createElement('strong');n.textContent=t.status===1?number(t.total):'—';n.title=t.total.toLocaleString('zh-CN')+' Token';const state=document.createElement('div');state.className='state';state.textContent=status[t.status];const bar=document.createElement('div');bar.className='track';const fill=document.createElement('i');fill.style.background=colors[i];fill.style.width=(s.total?t.total/s.total*100:0)+'%';bar.append(fill);o.append(name,n,state,bar);$('tools').append(o)});}
async function poll(){try{const response=await fetch('/api/state');if(!response.ok)throw Error();data=await response.json();render()}catch{$('connection').textContent='电脑端采集器已停止';$('connection').className='link'}setTimeout(poll,2000)}poll();
</script></html>
